        </div>

        <div id="formContainer" style="display: flex; flex-direction: column; align-items: flex-start; gap: 10px;">

                <button id="toggleFilterBoxBtn" type="button" class="btn btn-secondary">Hide Filters</button>
            </div>
            <div id="formWrapper" style="display: none;">

                    target="hidden_iframe"

                    method="POST">
                    <fieldset>
                        <h2>Suggestion Form<br><small></small></h2>
                    </fieldset>


                    <!-- Field type: "dropdown" id: "786733064" -->
                    <fieldset>
                        <legend for="786733064">Query Type</legend>
                        <div class="form-group">
                            <select id="786733064" name="entry.954817908" class="form-control">
                                <option value="Comment">Comment</option>
                                <option value="New Location Suggestion">New Location Suggestion</option>
                            </select>
                        </div>
                    </fieldset>


                    <!-- Field type: "dropdown" id: "999410215" -->
                    <fieldset id="location-fieldset">
                        <legend for="999410215">Location</legend>
                        <div class="form-group">
                            <select id="999410215" name="entry.1369825634" class="form-control">
                                <option value=""></option>
                                <option value="Santolan Town Plaza">Santolan Town Plaza</option>
                                <option value="Puregold Agora">Puregold Agora</option>
                                <option value="GH Mall">GH Mall</option>

                                <option value="City Hall">City Hall</option>
                                <option value="National Government Center">National Government Center</option>
                                <option value="San Juan Hall of Justice">San Juan Hall of Justice</option>
                                <option value="Land Transportation Office (LTO) San Juan">Land Transportation Office (LTO) San Juan</option>
                                <option value="Pinaglabanan Park">Pinaglabanan Park</option>
                                <option value="Mini Park">Mini Park</option>
                                <option value="Filoil EcoOil Centre">Filoil EcoOil Centre</option>
                                <option value="San Juan Plaza">San Juan Plaza</option>
                            </select>
                        </div>
                    </fieldset>


                    <!-- Field type: "paragraph" id: "1383028868" -->
                    <fieldset id="comment-fieldset">
                        <legend for="1383028868">Comment or Suggestion</legend>
                        <div class="form-group">
                            <textarea id="2006740745" name="entry.2006740745" class="form-control" ></textarea>
                        </div>
                    </fieldset>


                    <!-- Field type: "short" id: "601711236" -->
                    <fieldset id="name-fieldset">
                        <legend for="601711236">Name</legend>
                        <div class="form-group">
                            <input id="808266618" type="text" name="entry.808266618" class="form-control" >
                        </div>
                    </fieldset>


                    <!-- Field type: "choices" id: "855366232" -->
                    <fieldset id="type-fieldset">
                        <legend for="855366232">Type of Establishment</legend>
                        <div class="form-group">
                            <div class="radio">
                                <label>
                                    <input type="radio" name="entry.649135730" value="Government" >
                                    Government
                                </label>
                            </div>
                            <div class="radio">
                                <label>
                                    <input type="radio" name="entry.649135730" value="Park" >
                                    Park
                                </label>
                            </div>
                            <div class="radio">

                                    Others
                                </label>
                            </div>
                        </div>
                    </fieldset>


                    <!-- Field type: "checkboxes" id: "12705910" -->
                    <fieldset id="features-fieldset">
                        <legend for="12705910">Features</legend>
                        <div class="form-group">
                            <div class="checkbox">
                                <label>
                                    <input type="checkbox" name="entry.513588152" value="Wheelchair-accessible entrances" >
                                    Wheelchair-accessible entrances
                                </label>
                            </div>
                            <div class="checkbox">
                                <label>
                                    <input type="checkbox" name="entry.513588152" value="Elevator access on all floors" >
                                    Elevator access on all floors
                                </label>
                            </div>
                            <div class="checkbox">
                                <label>
                                    <input type="checkbox" name="entry.513588152" value="Accessible/Universal Washrooms" >
                                    Accessible/Universal Washrooms
                                </label>
                            </div>
                            <div class="checkbox">
                                <label>
                                    <input type="checkbox" name="entry.513588152" value="Sign-language Trained Workers" >
                                    Sign-language Trained Workers
                                </label>
                            </div>
                            <div class="checkbox">
                                <label>
                                    <input type="checkbox" name="entry.513588152" value="Online Services" >
                                    Online Services
                                </label>
                            </div>
                            <div class="checkbox">
                                <label>
                                    <input type="checkbox" name="entry.513588152" value="Service Animal-Friendly" >

                            <div class="checkbox">

                                </label>

                    <!-- Field type: "paragraph" id: "157596120" -->
                    <fieldset id="notes-fieldset">

                        <div class="form-group">
                            <textarea id="199907410" name="entry.199907410" class="form-control" ></textarea>
                        </div>
                    </fieldset>

                    <input type="hidden" name="fvv" value="1">
                    <input type="hidden" name="fbzx" value="-3712829229282549581">
                    <!--
        CAVEAT: In multipages (multisection) forms, *pageHistory* field tells to google what sections we've currently completed.
        This usually starts as "0" for the first page, then "0,1" in the second page... up to "0,1,2..N" in n-th page.
        Keep this in mind if you plan to change this code to recreate any sort of multipage-feature in your exported form.
        We're setting this to the total number of pages in this form because we're sending all fields from all the section together.
    -->
                    <input type="hidden" name="pageHistory" value="0">

                    <input class="btn btn-primary" type="submit" value="Submit">

        <div id="mapPanel">
            <hr style="margin: 8px 0;">
            <strong>Map Filters</strong>
            <label for="" style="font-style: italic;"><input type="checkbox" id="labelToggle" checked><span class="mapCheckbox"></span> Show Labels</label>
            <label for=""><input type="checkbox" id="filterMalls" checked onchange="toggleLayer(mallLayer, this)"><span class="mapCheckbox"></span> Malls</label>

                <label><input type="checkbox" class="feature-filter" value="Abundant Public Seating"> Abundant Public Seating</label>
